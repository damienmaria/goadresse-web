name: Check Expired Subscriptions

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-expired-subscriptions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check expired subscriptions
        run: |
          echo "🔍 Vérification des abonnements expirés..."
          
          # Vérifier les secrets
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ SUPABASE_URL non configuré"
            exit 1
          fi
          
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY non configuré"
            exit 1
          fi
          
          # Appel curl avec meilleure gestion
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/check-expired-subscriptions")
          
          # Parser correctement (dernière ligne = code HTTP)
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          
          echo "📊 Code de réponse HTTP: $http_code"
          echo "📋 Réponse: $body"
          
          if [ "$http_code" = "200" ]; then
            echo "✅ Vérification réussie"
            processed=$(echo "$body" | jq -r '.processed // 0' 2>/dev/null || echo "0")
            echo "📈 Abonnements traités: $processed"
            
            if [ "$processed" -gt 0 ]; then
              echo "⚠️ $processed abonnement(s) désactivé(s)"
            else
              echo "✅ Aucun abonnement expiré"
            fi
          else
            echo "❌ Erreur HTTP $http_code"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 ALERTE: Vérification des abonnements échouée"
